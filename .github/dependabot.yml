version: 2

updates:
  # GitHub Actions only. The workflow pins actions to commit SHAs, which are
  # immutable and therefore never pick up fixes on their own — Dependabot is
  # what makes that pinning maintainable instead of merely stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # Deliberately absent: a `mix` entry for skeleton/. That lockfile defines the
  # start state every model is measured against. Bumping it changes the exam
  # without changing any task, which would make old rows in RESULTS.md
  # incomparable to new ones while still looking like the same benchmark.
  #
  # Also deliberately absent: a `docker` entry for the Dockerfile. Its base tag
  # names Elixir 1.20.2 on purpose, and an automated bump to 1.21 would quietly
  # dissolve the pin the whole benchmark rests on. Refresh the Debian snapshot
  # in that tag by hand when you want the OS patches; never let the update move
  # the Elixir or OTP version. CI's `container` job fails loudly if it does.
